[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-monitor"
version = "0.1.0"
description = "Traffic Sign Recognition and Road Safety Monitor — educational research demo (not safety-certified)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-contrib-python-headless==5.0.0.93", "pandas>=2.0", "pyyaml>=6.0",
                "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10.0"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=7.0"]

[project.scripts]
traffic-monitor = "traffic_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
