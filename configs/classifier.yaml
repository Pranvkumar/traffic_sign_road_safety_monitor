# GTSRB sign classification experiments (all models NumPy, CPU).
seed: 42
data_config: configs/data.yaml
image_size: 32
n_classes: 43
output_dir: experiments/runs/classifier

models:
  pixel_mlp:            # simple baseline: grayscale pixels -> MLP
    hidden: [256]
    optimizer: momentum
    lr: 0.02
    epochs: 15
    batch_size: 128
    weight_decay: 0.0001
  hog_mlp:              # HOG + colour thumbnail -> MLP (used in the live pipeline: fast)
    hidden: [256]
    optimizer: momentum
    lr: 0.02
    epochs: 15
    batch_size: 128
    weight_decay: 0.0001
  small_cnn:            # 2-conv-layer CNN from scratch, train-only augmentation
    optimizer: adam
    lr: 0.001
    epochs: 8
    batch_size: 128
    augment: true

selection_metric: val_macro_f1   # model chosen on validation, test reported once
deploy_model: hog_mlp            # checkpoint copied to models/checkpoints/classifier_hog_mlp.npz
