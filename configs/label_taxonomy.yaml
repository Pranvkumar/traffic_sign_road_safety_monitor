# Project label taxonomy, version v1.
# Source class IDs are kept unchanged. No cross-dataset merging is done in v1.
version: v1

detection:            # IDD-derived detector: class-agnostic sign localisation
  0: traffic_sign

classification:       # GTSRB 43 classes (German signs). Not an Indian taxonomy.
  0: speed_limit_20
  1: speed_limit_30
  2: speed_limit_50
  3: speed_limit_60
  4: speed_limit_70
  5: speed_limit_80
  6: end_speed_limit_80
  7: speed_limit_100
  8: speed_limit_120
  9: no_overtaking
  10: no_overtaking_trucks
  11: priority_at_next_intersection
  12: priority_road
  13: give_way
  14: stop
  15: no_vehicles
  16: no_trucks
  17: no_entry
  18: general_caution
  19: dangerous_curve_left
  20: dangerous_curve_right
  21: double_curve
  22: bumpy_road
  23: slippery_road
  24: road_narrows_right
  25: road_works
  26: traffic_signals
  27: pedestrians
  28: children_crossing
  29: bicycles_crossing
  30: ice_snow
  31: wild_animals_crossing
  32: end_all_restrictions
  33: turn_right_ahead
  34: turn_left_ahead
  35: ahead_only
  36: go_straight_or_right
  37: go_straight_or_left
  38: keep_right
  39: keep_left
  40: roundabout_mandatory
  41: end_no_overtaking
  42: end_no_overtaking_trucks

unknown_policy: >
  If the classifier's top probability is below `classifier.unknown_threshold`, the sign is
  reported as "unknown" instead of being forced into a GTSRB class.
